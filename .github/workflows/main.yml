name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirement.txt

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6==6.11.0 pyinstaller==6.22.3

    - name: Build exe (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onedir --noconsole --name toolChonFile --add-data "gui2.ui;." toolChonFile.py

    - name: Build app (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --onedir --windowed --name toolChonFile --add-data "gui2.ui:." toolChonFile.py

    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: toolChonFile-windows
        path: dist/toolChonFile/

    - name: Upload artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v7
      with:
        name: toolChonFile-macos
        path: dist/toolChonFile.app
